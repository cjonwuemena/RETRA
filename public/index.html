<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>Meeting Scribe</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <div class="app">
    <aside class="sidebar">
      <div class="brand">
        <span class="brand-dot"></span>
        <span>Meeting Scribe</span>

  <script src="db.js"></script>
  <script src="asr.js"></script>
  <script src="app.js"></script>

</html>
